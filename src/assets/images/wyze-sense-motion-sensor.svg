<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="sensorShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12" flood-color="#000000" />
    </filter>
    <linearGradient id="sensorFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaeff5"/>
    </linearGradient>
    <linearGradient id="sensorSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d1d9e2"/>
      <stop offset="100%" stop-color="#b0bcc9"/>
    </linearGradient>
  </defs>

  <!-- Drop Shadow & Isometric Base -->
  <rect x="20" y="24" width="56" height="56" rx="10" fill="#cbd5e1" opacity="0.6" filter="url(#sensorShadow)"/>

  <!-- Main 3D Sensor Body -->
  <!-- Back/Side depth -->
  <rect x="22" y="18" width="56" height="56" rx="10" fill="url(#sensorSide)"/>
  <!-- Front face -->
  <rect x="18" y="22" width="56" height="56" rx="10" fill="url(#sensorFront)" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Fresnel Lens Dome -->
  <circle cx="46" cy="50" r="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="46" cy="50" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="46" cy="50" r="5" fill="#ffffff"/>

  <!-- Subtle Status LED -->
  <circle cx="46" cy="30" r="1.5" fill="#ef4444"/>
</svg>
