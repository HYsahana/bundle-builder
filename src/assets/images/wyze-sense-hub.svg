<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="hubShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.15" flood-color="#000000" />
    </filter>
    <linearGradient id="hubTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="hubSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Left Antenna -->
  <line x1="26" y1="44" x2="16" y2="12" stroke="url(#antennaGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="16" cy="12" r="2.5" fill="#334155"/>

  <!-- Right Antenna -->
  <line x1="74" y1="44" x2="84" y2="12" stroke="url(#antennaGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="84" cy="12" r="2.5" fill="#334155"/>

  <!-- Drop Shadow -->
  <polygon points="12,58 50,78 88,58 50,42" fill="#94a3b8" opacity="0.4" filter="url(#hubShadow)"/>

  <!-- Hub Base / Bottom Side -->
  <polygon points="14,56 50,76 86,56 86,64 50,84 14,64" fill="url(#hubSide)" stroke="#475569" stroke-width="0.75"/>

  <!-- Hub Top Surface -->
  <polygon points="14,56 50,38 86,56 50,74" fill="url(#hubTop)" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Speaker grille on top -->
  <line x1="42" y1="52" x2="58" y2="60" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="56" x2="62" y2="68" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wyze Logo / LED Status -->
  <circle cx="50" cy="46" r="2.5" fill="#3b82f6"/>
</svg>
